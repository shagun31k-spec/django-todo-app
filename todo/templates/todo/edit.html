<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ffecd2, #fcb69f);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #7c3aed;
        }

        form {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #c4b5fd;
            border-radius: 10px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            background: #7c3aed;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Edit Task</h1>

    <form method="POST">
        {% csrf_token %}

        <input
            type="text"
            name="title"
            value="{{ task.title }}"
        >

        <button type="submit">Save</button>
    </form>

</div>

</body>
</html>
